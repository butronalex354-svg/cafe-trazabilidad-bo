# Corre solo en GitHub cada vez que se sube un cambio (push) o se abre un
# pull request: las pruebas del backend y la compilacion del frontend.
# Si todo pasa, GitHub muestra una marca verde junto al commit.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Laravel + PHPUnit)
    runs-on: ubuntu-latest
    services:
      # Misma version de MariaDB que trae XAMPP, en el mismo puerto (3307)
      # que usa backend/phpunit.xml.
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: cafe_trazabilidad_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, openssl, fileinfo, curl, zip
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Correr pruebas
        run: php artisan test

  frontend:
    name: Frontend (Quasar build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npx quasar build
